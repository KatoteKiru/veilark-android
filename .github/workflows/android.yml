name: Android verification

on:
  pull_request:
  push:
    branches: [master, main, cursor/trusttunnel-query-deeplink]

permissions:
  contents: read

jobs:
  oss:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Test, lint and assemble OSS
        run: ./gradlew testOssDebugUnitTest lintOssRelease assembleOssDebug assembleOssDebugAndroidTest --no-daemon --no-configuration-cache
      - name: Upload installable debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: veilark-oss-debug
          path: app/build/outputs/apk/oss/debug/app-oss-debug.apk
          if-no-files-found: error
