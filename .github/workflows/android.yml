name: Android verification

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  oss:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test, lint and assemble OSS
        run: ./gradlew testOssDebugUnitTest lintOssRelease assembleOssDebug assembleOssDebugAndroidTest --no-daemon --no-configuration-cache
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: veilark-oss-debug
          path: app/build/outputs/apk/oss/debug/app-oss-debug.apk
          if-no-files-found: error
