name: Android verification

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  oss:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Test, lint and assemble OSS
        run: ./gradlew testOssDebugUnitTest lintOssRelease assembleOssDebug assembleOssDebugAndroidTest --no-daemon --no-configuration-cache
      - name: Upload installable debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: veilark-oss-debug
          path: app/build/outputs/apk/oss/debug/app-oss-debug.apk
          if-no-files-found: error
