name: macOS native chrome

on:
  workflow_dispatch:
  push:
    branches: [codex/macos-native-glass]
    paths: ['macos/**', '.github/workflows/macos-native-chrome.yml']

permissions:
  contents: read

jobs:
  native-ui:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: macos
    env:
      VEILARK_CAPTURE_NATIVE_UI: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile AppKit bridge and test UI lifecycle
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon test --max-workers=2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-chrome-${{ matrix.os }}-test-results
          retention-days: 3
          path: |
            macos/build/test-results/test/*.xml
            macos/build/reports/native-chrome.png
