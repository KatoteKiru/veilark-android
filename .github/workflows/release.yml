name: OSS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing or new v-prefixed release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VEILARK_OSS_KEYSTORE: ${{ runner.temp }}/veilark-oss-release.jks
      VEILARK_OSS_STORE_PASSWORD: ${{ secrets.VEILARK_OSS_STORE_PASSWORD }}
      VEILARK_OSS_KEY_ALIAS: ${{ secrets.VEILARK_OSS_KEY_ALIAS }}
      VEILARK_OSS_KEY_PASSWORD: ${{ secrets.VEILARK_OSS_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release key
        env:
          KEYSTORE_B64: ${{ secrets.VEILARK_OSS_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$VEILARK_OSS_KEYSTORE"
      - name: Test and build signed OSS release
        run: ./gradlew testOssDebugUnitTest lintOssRelease assembleOssRelease --no-daemon
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          case "$RELEASE_TAG" in v*) ;; *) echo "Tag must start with v"; exit 1;; esac
      - name: Verify and checksum APK
        shell: bash
        run: |
          APK=app/build/outputs/apk/oss/release/app-oss-release.apk
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            app/build/outputs/apk/oss/release/app-oss-release.apk \
            app/build/outputs/apk/oss/release/app-oss-release.apk.sha256 \
            --target "$GITHUB_SHA" --generate-notes --title "Veilark $RELEASE_TAG"
