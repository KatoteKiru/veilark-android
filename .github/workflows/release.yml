name: OSS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing or new v-prefixed release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VEILARK_OSS_STORE_PASSWORD: ${{ secrets.VEILARK_OSS_STORE_PASSWORD }}
      VEILARK_OSS_KEY_ALIAS: ${{ secrets.VEILARK_OSS_KEY_ALIAS }}
      VEILARK_OSS_KEY_PASSWORD: ${{ secrets.VEILARK_OSS_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?-oss$ ]]; then
            echo "Tag must match vX.Y.Z-oss or vX.Y.Z-rcN-oss"
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Refusing to overwrite existing tag: $RELEASE_TAG"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG"; then
            echo "Refusing to reuse existing remote tag: $RELEASE_TAG"
            exit 1
          else
            STATUS=$?
            if [[ "$STATUS" -ne 2 ]]; then
              echo "Unable to verify remote tag uniqueness"
              exit "$STATUS"
            fi
          fi
      - name: Restore release key
        env:
          KEYSTORE_B64: ${{ secrets.VEILARK_OSS_KEYSTORE_B64 }}
          VEILARK_OSS_KEYSTORE: ${{ runner.temp }}/veilark-oss-release.jks
        run: |
          test -n "$KEYSTORE_B64"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$VEILARK_OSS_KEYSTORE"
      - name: Test and build signed OSS release
        env:
          VEILARK_OSS_KEYSTORE: ${{ runner.temp }}/veilark-oss-release.jks
        run: |
          python3 -I -m unittest discover -s scripts -p 'test_*.py' -q
          python3 scripts/verify_trusttunnel_vendor.py
          ./gradlew testOssDebugUnitTest lintOssRelease assembleOssRelease --no-daemon --no-configuration-cache
      - name: Verify identity, signer and access-material policy
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/oss/release/app-oss-release.apk
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          SIGNING_REPORT=$($APKSIGNER verify --verbose --print-certs "$APK")
          printf '%s\n' "$SIGNING_REPORT"
          printf '%s\n' "$SIGNING_REPORT" | grep -Eq 'Verified using v(2|3) scheme \(APK Signature Scheme v(2|3)\): true'
          SIGNER_SHA256=$(printf '%s\n' "$SIGNING_REPORT" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          test "$SIGNER_SHA256" = "8fc1db1fe13f7226af20076026e9e753de15626b2c4b9ddc4bd8974a03af3763"
          BADGING=$($AAPT dump badging "$APK")
          printf '%s\n' "$BADGING" | grep -F "package: name='app.veilark.android'"
          VERSION_NAME=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          test "$RELEASE_TAG" = "v$VERSION_NAME"
          if printf '%s\n' "$BADGING" | grep -q 'application-debuggable'; then
            echo "Release APK must not be debuggable"
            exit 1
          fi
          python3 scripts/scan_android_artifact.py "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION_NAME="${RELEASE_TAG#v}"
          RELEASE_APK="Veilark-Android-$VERSION_NAME.apk"
          cp app/build/outputs/apk/oss/release/app-oss-release.apk "$RELEASE_APK"
          sha256sum "$RELEASE_APK" > "$RELEASE_APK.sha256"
          NOTES="docs/releases/$RELEASE_TAG.md"
          if [[ -f "$NOTES" ]]; then
            NOTE_ARGS=(--notes-file "$NOTES")
          else
            NOTE_ARGS=(--generate-notes)
          fi
          gh release create "$RELEASE_TAG" "$RELEASE_APK" "$RELEASE_APK.sha256" \
            --target "$GITHUB_SHA" --title "Veilark Android $VERSION_NAME" \
            --latest "${NOTE_ARGS[@]}"
