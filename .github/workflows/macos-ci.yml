name: macOS package verification

on:
  push:
    paths:
      - '.github/workflows/macos-ci.yml'
      - 'macos/**'
  pull_request:
    paths:
      - '.github/workflows/macos-ci.yml'
      - 'macos/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Test, compile helper and package DMG
        run: |
          set -euo pipefail
          chmod +x gradlew scripts/*.sh
          test "$(uname -m)" = arm64
          ./gradlew --no-daemon test
          ./scripts/fetch-engines.sh
          ./gradlew --no-daemon packageDmg
          dmg="$(find build/compose/binaries/main/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg" && test -s "$dmg"
          hdiutil verify "$dmg"
          shasum -a 256 "$dmg"
      - name: Upload unpromoted Mac candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: veilark-macos-unpromoted
          retention-days: 3
          path: macos/build/compose/binaries/main/dmg/*.dmg
