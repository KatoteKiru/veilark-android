name: macOS package verification

on:
  push:
    paths:
      - '.github/workflows/macos-ci.yml'
      - 'macos/**'
  pull_request:
    paths:
      - '.github/workflows/macos-ci.yml'
      - 'macos/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Release-equivalent packaging: macOS 26 SDK so AppKit Liquid Glass APIs are compiled in.
    # Runtime lookups/availability guards keep the same DMG working on macOS 12-15.
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Select Xcode 26 (macOS 26 SDK)
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -Eiv 'beta|_rc|release_candidate' | sort -V | tail -1 || true)"
          [ -n "$xcode" ] || xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          [ -n "$xcode" ] || { echo "No Xcode 26 on this runner" >&2; ls -d /Applications/Xcode*.app >&2; exit 1; }
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK $sdk; $(swiftc --version 2>&1 | head -1); $(clang --version | head -1)"
          [ "${sdk%%.*}" -ge 26 ] || { echo "macOS 26 SDK required, found $sdk" >&2; exit 1; }
      - name: Test, compile helper and package DMG
        env:
          VEILARK_REQUIRE_SDK_MAJOR: '26'
        run: |
          set -euo pipefail
          chmod +x gradlew scripts/*.sh
          test "$(uname -m)" = arm64
          python3 -m unittest discover -s scripts -p 'test_normalize_macho_signature.py'
          swiftc helper/HelperConfigPolicy.swift helper/HelperConfigPolicyTests.swift -o "$RUNNER_TEMP/helper-config-policy-tests"
          "$RUNNER_TEMP/helper-config-policy-tests"
          ./gradlew --no-daemon test
          ./scripts/fetch-engines.sh
          ./gradlew --no-daemon packageDmg
          dmg="$(find build/compose/binaries/main/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg" && test -s "$dmg"
          hdiutil verify "$dmg"
          shasum -a 256 "$dmg"
      - name: Capture actual candidate window without starting a VPN
        run: |
          set -euo pipefail
          app="build/compose/binaries/main/app/Veilark.app"
          test -d "$app"
          open -n "$app"
          sleep 12
          screencapture -x "$RUNNER_TEMP/veilark-macos-window.png"
      - name: Upload unpromoted Mac candidate
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: veilark-macos-unpromoted
          retention-days: 3
          path: |
            macos/build/compose/binaries/main/dmg/*.dmg
            ${{ runner.temp }}/veilark-macos-window.png
      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: veilark-macos-test-diagnostics
          retention-days: 3
          path: |
            macos/build/test-results/test/*.xml
            macos/build/native/libveilark-chrome.dylib
            macos/build/compose/binaries/main/app/Veilark.app/Contents/app/resources/libveilark-chrome.dylib
