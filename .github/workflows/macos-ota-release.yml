name: macOS OTA preview release

on:
  push:
    tags:
      - "macos-v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: macos-ota-release
  cancel-in-progress: false

jobs:
  build-publish-verify:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: macos
    env:
      OTA_ORIGIN: ${{ vars.VEILARK_MACOS_OTA_ORIGIN }}
      OTA_HOST: ${{ vars.VEILARK_MACOS_OTA_HOST }}
      OTA_USER: ${{ vars.VEILARK_MACOS_OTA_USER }}
      OTA_PUBLIC_KEY: ${{ vars.VEILARK_MACOS_OTA_PUBLIC_KEY }}
      OTA_SIGNING_KEY_B64: ${{ secrets.VEILARK_MACOS_OTA_SIGNING_KEY_B64 }}
      OTA_DEPLOY_KEY: ${{ secrets.VEILARK_MACOS_OTA_DEPLOY_KEY }}
      OTA_KNOWN_HOSTS: ${{ secrets.VEILARK_MACOS_OTA_KNOWN_HOSTS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: macos/**/*.gradle*

      - name: Validate release identity and channel
        shell: bash
        run: |
          set -euo pipefail
          for value in OTA_ORIGIN OTA_HOST OTA_USER OTA_PUBLIC_KEY OTA_SIGNING_KEY_B64 OTA_DEPLOY_KEY OTA_KNOWN_HOSTS; do
            [ -n "${!value:-}" ] || { echo "Missing release setting: $value" >&2; exit 1; }
          done
          VERSION="$(sed -n 's/^macosVersion=//p' gradle.properties)"
          BUILD="$(sed -n 's/^macosBuild=//p' gradle.properties)"
          REQUIRE_GATEKEEPER="$(sed -n 's/^macosOtaRequireGatekeeper=//p' gradle.properties)"
          [ "$GITHUB_REF_NAME" = "macos-v$VERSION" ] || {
            echo "Tag $GITHUB_REF_NAME does not match macosVersion=$VERSION" >&2
            exit 1
          }
          [ "$REQUIRE_GATEKEEPER" = "false" ] || {
            echo "Preview workflow may not publish the production Gatekeeper channel" >&2
            exit 1
          }
          ARTIFACT="veilark-macos-$VERSION-arm64.dmg"
          URL="$OTA_ORIGIN/$ARTIFACT"
          {
            echo "VERSION=$VERSION"
            echo "BUILD=$BUILD"
            echo "ARTIFACT=$ARTIFACT"
            echo "OTA_URL=$URL"
          } >> "$GITHUB_ENV"

      - name: Select Xcode 26 (macOS 26 SDK)
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -Eiv 'beta|_rc|release_candidate' | sort -V | tail -1 || true)"
          [ -n "$xcode" ] || xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          [ -n "$xcode" ] || { echo "No Xcode 26 on this runner" >&2; ls -d /Applications/Xcode*.app >&2; exit 1; }
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK $sdk; $(swiftc --version 2>&1 | head -1); $(clang --version | head -1)"
          [ "${sdk%%.*}" -ge 26 ] || { echo "macOS 26 SDK required, found $sdk" >&2; exit 1; }
      - name: Prepare scripts and assert Apple Silicon
        run: |
          chmod +x gradlew scripts/*.sh
          test "$(uname -m)" = arm64

      - name: Test, fetch verified engines, and package DMG
        env:
          VEILARK_REQUIRE_SDK_MAJOR: "26"
        run: |
          swiftc helper/HelperConfigPolicy.swift helper/HelperConfigPolicyTests.swift -o "$RUNNER_TEMP/helper-config-policy-tests"
          "$RUNNER_TEMP/helper-config-policy-tests"
          ./gradlew --no-daemon test
          ./scripts/fetch-engines.sh
          ./gradlew --no-daemon packageDmg

      - name: Create and self-verify signed OTA manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ota
          SOURCE_DMG="$(find build/compose/binaries/main/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          [ -n "$SOURCE_DMG" ]
          cp "$SOURCE_DMG" "build/ota/$ARTIFACT"
          printf '%s' "$OTA_SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/veilark-macos-ota.pem"
          chmod 0600 "$RUNNER_TEMP/veilark-macos-ota.pem"
          NOTES="Veilark $VERSION: редкая проверка обновлений в строке меню, системное уведомление один раз на новую версию и переход в настройки по нажатию. VPN, маршруты и helper не менялись. / Periodic update checks while running in the menu bar, one native notification per new release, click to open Settings. VPN, routing and helper unchanged. Preview, not Apple-notarized."
          ./gradlew --no-daemon createOtaManifest \
            "-PotaDmg=build/ota/$ARTIFACT" \
            "-PotaManifestOutput=build/ota/manifest.json" \
            "-PotaSigningKey=$RUNNER_TEMP/veilark-macos-ota.pem" \
            "-PotaVersion=$VERSION" \
            "-PotaBuild=$BUILD" \
            "-PotaArchitecture=arm64" \
            "-PotaUrl=$OTA_URL" \
            "-PotaNotes=$NOTES" \
            "-PotaPublicKey=$OTA_PUBLIC_KEY"

      - name: Exercise native in-app replacement
        run: ./scripts/test-in-app-updater.sh "build/ota/$ARTIFACT" build/ota/manifest.json

      - name: Verify live channel is signed and older
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "$OTA_ORIGIN/manifest.json" -o "$RUNNER_TEMP/live-manifest.json"
          ./gradlew --no-daemon verifyExistingOtaManifest \
            "-PotaExistingManifest=$RUNNER_TEMP/live-manifest.json" \
            "-PotaCandidateBuild=$BUILD" \
            "-PotaPublicKey=$OTA_PUBLIC_KEY"

      - name: Atomically deploy OTA files
        shell: bash
        run: |
          set -euo pipefail
          install -m 0600 /dev/null "$RUNNER_TEMP/ota_deploy_key"
          printf '%s\n' "$OTA_DEPLOY_KEY" > "$RUNNER_TEMP/ota_deploy_key"
          install -m 0600 /dev/null "$RUNNER_TEMP/known_hosts"
          printf '%s\n' "$OTA_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          MANIFEST_TMP=".manifest.$GITHUB_RUN_ID.json"
          MANIFEST_BACKUP="manifest.backup.$(date -u +%Y%m%dT%H%M%SZ).$GITHUB_RUN_ID.json"
          sftp -b - \
            -i "$RUNNER_TEMP/ota_deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            "$OTA_USER@$OTA_HOST" <<EOF
          put $RUNNER_TEMP/live-manifest.json /veilark-macos/$MANIFEST_BACKUP
          chmod 0644 /veilark-macos/$MANIFEST_BACKUP
          put build/ota/$ARTIFACT /veilark-macos/.$ARTIFACT.uploading
          chmod 0644 /veilark-macos/.$ARTIFACT.uploading
          rename /veilark-macos/.$ARTIFACT.uploading /veilark-macos/$ARTIFACT
          put build/ota/manifest.json /veilark-macos/$MANIFEST_TMP
          chmod 0644 /veilark-macos/$MANIFEST_TMP
          rename /veilark-macos/$MANIFEST_TMP /veilark-macos/manifest.json
          EOF

      - name: Redownload and verify production bytes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "$OTA_ORIGIN/manifest.json" -o "$RUNNER_TEMP/manifest.json"
          cmp build/ota/manifest.json "$RUNNER_TEMP/manifest.json"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "$OTA_URL" -o "$RUNNER_TEMP/$ARTIFACT"
          EXPECTED="$(/usr/bin/plutil -extract sha256 raw -o - build/ota/manifest.json)"
          ACTUAL="$(shasum -a 256 "$RUNNER_TEMP/$ARTIFACT" | awk '{print $1}')"
          [ "$ACTUAL" = "$EXPECTED" ]
          hdiutil verify "$RUNNER_TEMP/$ARTIFACT"

      - name: Publish GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          NOTES="Veilark $VERSION for Apple Silicon: update checks continue while the app runs in the menu bar. One native notification per new release; click it to open Settings. VPN, routing and helper are unchanged. Existing Ed25519 OTA key retained. Preview: not Apple-notarized. Physical notification delivery and VPN acceptance are not claimed by CI."
          gh release create "$GITHUB_REF_NAME" \
            "build/ota/$ARTIFACT#Veilark $VERSION DMG (ARM64 preview)" \
            "build/ota/manifest.json#Signed macOS OTA manifest" \
            --verify-tag \
            --prerelease \
            --title "Veilark $VERSION for macOS" \
            --notes "$NOTES"

      - name: Upload verified CI evidence
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: veilark-macos-${{ env.VERSION }}-verified
          path: |
            macos/build/ota/${{ env.ARTIFACT }}
            macos/build/ota/manifest.json
            macos/build/ota/manifest.json.sha256
          if-no-files-found: error
